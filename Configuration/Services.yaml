services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicPartners\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*.php'

  FGTCLB\AcademicPartners\Domain\Repository\PartnerRepository:
    public: true

  FGTCLB\AcademicPartners\DataProcessing\PartnerProcessor:
    tags:
      - {
          name: 'data.processor',
          identifier: 'partner-data',
          label: 'Partner Processor'
        }

  # TYPO3's `Core\Attribute\AsEventListener` does not exist on TYPO3 v12, which this
  # branch supports, so the listener is registered here. Symfony's attribute of the same
  # name is not a substitute: it registers nothing in TYPO3 and the listener would
  # silently never fire.
  FGTCLB\AcademicPartners\EventListener\AddPageModuleCategorySummary:
    tags:
      - name: event.listener
        identifier: 'academic-partners/page-module-category-summary'
        event: TYPO3\CMS\Backend\Controller\Event\ModifyPageLayoutContentEvent
