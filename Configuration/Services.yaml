services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicPartners\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*.php'

  FGTCLB\AcademicPartners\Domain\Repository\PartnerRepository:
    public: true

  # Instantiated by the DataHandler through GeneralUtility::makeInstance(), which
  # resolves a public service from the container - constructor injection needs it.
  FGTCLB\AcademicPartners\Hook\PartnershipSortingHook:
    public: true

  FGTCLB\AcademicPartners\DataProcessing\PartnerProcessor:
    tags:
      - {
          name: 'data.processor',
          identifier: 'partner-data',
          label: 'Partner Processor'
        }
