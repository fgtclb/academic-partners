<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ace="http://typo3.org/ns/FGTCLB/AcademicPartners/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<div class="col-12 col-md-6 col-lg-4 col-xl-3">
    <div class="ace-filter ace-field ace-select-wrap">
        <label class="ace-label" for="sortingField">
            {f:translate(key: 'sorting.field.label', extensionName: 'AcademicPartners')}
        </label>

        <ace:form.sortingSelect
            class="ace-control ace-select"
            id="sortingField"
            property="sortingField"
            value="{demand.sortingField}"
            type="fields"
            additionalAttributes="{'onchange': 'this.form.submit()'}"
            l10n="filter.sortingField"
        />
    </div>
</div>

<div class="col-12 col-md-6 col-lg-4 col-xl-3">
    <div class="ace-filter ace-field ace-select-wrap">
        <label class="ace-label" for="sortingDirection">
            {f:translate(key: 'sorting.direction.label', extensionName: 'AcademicPartners')}
        </label>

        <ace:form.sortingSelect
            class="ace-control ace-select"
            id="sortingDirection"
            property="sortingDirection"
            value="{demand.sortingDirection}"
            type="directions"
            additionalAttributes="{'onchange': 'this.form.submit()'}"
            l10n="filter.sortingDirection"
        />
    </div>
</div>

</html>
