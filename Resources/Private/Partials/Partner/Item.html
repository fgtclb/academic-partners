<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ct="http://typo3.org/ns/FGTCLB/CategoryTypes/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<article class="ace-item">
    <div class="ace-item-content">
        <f:render
            partial="Partner/Header"
            arguments="{
                header: '{partner.title}',
                layout: '{data.header_layout}',
                link: '{f:uri.page(pageUid: partner.uid)}',
                subheader: '{data.subheader}'
            }"
        />

        <f:if condition="{partner.attributes}">
            <f:render
                partial="Partner/Categories"
                arguments="{_all}"
            />
        </f:if>
    </div>

    <f:for each="{partner.media}" as="image" iteration="i">
        <f:if condition="{i.isFirst}">
            <f:comment>
                The shared partial of EXT:academic_base. A partner logo keeps its own
                ratio, so the preset is "logo" rather than "card", and a vector logo is
                passed through unprocessed.
            </f:comment>
            <f:render
                partial="Academic/Image"
                arguments="{
                    image: image,
                    preset: 'logo',
                }"
            />
        </f:if>
    </f:for>
</article>

</html>
