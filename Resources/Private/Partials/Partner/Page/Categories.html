<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ct="http://typo3.org/ns/FGTCLB/CategoryTypes/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The categories assigned to the partner page, grouped by category type. A type without
    an assigned category renders nothing.
</f:comment>

<f:if condition="{partner.attributes.allCategoriesByType}">
    <f:render
        partial="Partner/Categories"
        arguments="{_all}"
    />
</f:if>

</html>
