<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<div class="academic-partners-list container">

    <f:if condition="{settings.renderContentElementHeader}">
        <f:render partial="Header/All" arguments="{_all}" />
    </f:if>

    <div class="ace-content">
        <f:render
            partial="Partner/SortingAndFilters"
            arguments="{_all}"
        />

        <f:render
            partial="Partner/ItemList"
            arguments="{_all}"
        />
    </div>
</div>

</html>
