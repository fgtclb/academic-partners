# A type a project adds to the shipped `partners` group, with a title of its own and no
# label `sys_category.partners.funding_body` in the language file of the extension. The title is
# a label reference with a German translation.
types:
  - identifier: funding_body
    title: 'LLL:EXT:test_partners_titled_category_type/Resources/Private/Language/locallang.xlf:funding_body'
    group: partners
    icon: 'EXT:core/Resources/Public/Icons/T3Icons/svgs/apps/apps-pagetree-folder-contains-category.svg'
  # The shipped region, retitled the way a project may retitle it for the backend. Its
  # label in the language file of the extension still names it in the frontend.
  - identifier: region
    group: partners
    title: 'Area'
    useExisting: true
